# docker-compose.yml

version: '3.8'

services:
  db:
    image: postgres:15
    container_name: wayne_catalog_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-catalog_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Optional: Mount scripts for automatic execution on first startup
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql

volumes:
  pgdata: